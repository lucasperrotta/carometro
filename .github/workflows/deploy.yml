# ============================================
# GitHub Actions - Deploy para GitHub Pages
# ============================================
# Este workflow faz o build e deploy automático
# sempre que houver push na branch main.

name: Deploy to GitHub Pages

on:
  # Roda em push na branch main
  push:
    branches: ['main']
  
  # Permite rodar manualmente pela interface do GitHub
  workflow_dispatch:

# Define permissões necessárias para o GITHUB_TOKEN
permissions:
  contents: read
  pages: write
  id-token: write

# Permite apenas um deploy simultâneo
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # ============================================
  # JOB 1: Build do projeto
  # ============================================
  build:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout do código
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # 2. Instalar Node.js
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Instalar dependências
      - name: 📦 Install dependencies
        run: npm ci

      # 4. Buildar o projeto
      - name: 🔨 Build project
        run: npm run build

      # 5. Configurar GitHub Pages
      - name: ⚙️ Setup Pages
        uses: actions/configure-pages@v4

      # 6. Upload do artifact (pasta dist/)
      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # ============================================
  # JOB 2: Deploy para GitHub Pages
  # ============================================
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    runs-on: ubuntu-latest
    needs: build  # Depende do job de build
    
    steps:
      # Deploy efetivo no GitHub Pages
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
